services:
  bot:
    build: .
    container_name: lastfm_robot_py
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "${SPOTIFY_CALLBACK_PORT:-8080}:${SPOTIFY_CALLBACK_PORT:-8080}"
    networks:
      - internal

networks:
  internal:
    driver: bridge
